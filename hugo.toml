baseURL = 'https://cursolinux.sidneiweber.com.br/'
languageCode = 'pt-br'
defaultContentLanguage = 'pt'
title = 'Curso Linux'
theme = 'relearn'

[languages.pt]
  languageName = 'Português'
  weight = 1

[params]
  editURL = 'https://github.com/sidneiweber/curso-linux/edit/main/content/${FilePath}'
  author.name = 'Sidnei Weber'
  themeVariant = [
    'sidnei-dark',
    'sidnei-light',
    { identifier = 'sidnei-auto', name = 'Automático', auto = ['sidnei-light', 'sidnei-dark'] }
  ]
  showVisitedLinks = true
  collapsibleMenu = true
  alwaysopen = false
  disableLandingPageButton = true
  disableInlineCopyToClipBoard = false
  linkTitle = 'Curso Linux'

[markup.highlight]
  noClasses = false
  style = 'monokai'

[outputs]
  home = ['html', 'rss']
